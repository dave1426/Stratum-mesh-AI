<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StratumMesh | AI Umbrella Router</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #38bdf8; text-align: center; }
        #chat-container { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 90%; line-height: 1.5; word-break: break-word; }
        .user { background: #0284c7; align-self: flex-end; white-space: pre-wrap; }
        .ai { background: #334155; align-self: flex-start; border: 1px solid #475569; }
        .ai pre { background: #0f172a; padding: 10px; border-radius: 6px; overflow-x: auto; border: 1px solid #475569; }
        .ai code { font-family: monospace; background: #0f172a; padding: 2px 4px; border-radius: 4px; }
        .ai pre code { background: none; padding: 0; }
        .input-area { display: flex; gap: 8px; }
        textarea { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; resize: none; height: 44px; font-family: inherit; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <h2>StratumMesh Router</h2>
    <div id="chat-container">
        <div class="message ai">Hello! I am StratumMesh. Type a prompt below to route it through the umbrella network.</div>
    </div>
    <div class="input-area">
        <textarea id="prompt-input" placeholder="Type your prompt here..."></textarea>
        <button onclick="sendPrompt()">Send</button>
    </div>

    <script>
        async function sendPrompt() {
            const input = document.getElementById('prompt-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            container.appendChild(userDiv);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = '<i>Connecting to StratumMesh stream...</i>';
            container.appendChild(aiDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                if (!res.ok) throw new Error('Network response was not ok');

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";
                let routedModel = "";

                aiDiv.innerHTML = ""; // Clear loader text

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.type === "meta") {
                                routedModel = data.routed_model;
                            } else if (data.type === "content") {
                                fullResponse += data.text;
                                aiDiv.innerHTML = `<b>[Model: ${routedModel}]</b><br><br>` + marked.parse(fullResponse);
                            } else if (data.type === "error") {
                                aiDiv.style.color = '#f87171';
                                aiDiv.textContent = 'Error: ' + data.detail;
                            }
                        } catch (e) {
                            // Ignore partial JSON chunks
                        }
                    }
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {
                aiDiv.style.color = '#f87171';
                aiDiv.textContent = 'Stream error or network failure.';
            }
        }
    </script>
</body>
</html>
